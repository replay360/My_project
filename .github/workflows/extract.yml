name: Extract Embed URL

on:
  workflow_dispatch:
    inputs:
      title:
        description: "اسم الفيلم أو المسلسل"
        required: true
        type: string
      year:
        description: "السنة (اختياري)"
        required: false
        default: ""
        type: string
      season:
        description: "رقم الموسم (اختياري للمسلسلات)"
        required: false
        default: ""
        type: string
      episode:
        description: "رقم الحلقة (اختياري للمسلسلات)"
        required: false
        default: ""
        type: string

concurrency:
  group: extract-embeds-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and Chromium
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run extractor
        env:
          TITLE: ${{ inputs.title }}
          YEAR: ${{ inputs.year }}
          SEASON: ${{ inputs.season }}
          EPISODE: ${{ inputs.episode }}
        run: python scraper.py

      - name: Commit and push updated embeds.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/embeds.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update embed for ${{ inputs.title }}"
            git pull --rebase origin main
            git push
          fi
